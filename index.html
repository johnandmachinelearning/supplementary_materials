<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Websites Showcase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#3b82f6', 600: '#2563eb' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-blue-500 selection:text-white">

  <!-- Navigation Bar -->
  <header class="sticky top-0 z-40 w-full border-b border-slate-800 bg-slate-950/80 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-blue-600/20 text-blue-400 rounded-lg border border-blue-500/30">
          <i class="fa-solid fa-folder-tree text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-slate-100 leading-tight">portfolio-websites</h1>
          <p class="text-xs text-slate-400">12 Ready-to-use HTML Templates</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="openReadmeModal()" class="px-3 py-1.5 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-md border border-slate-700 transition-colors flex items-center gap-2">
          <i class="fa-regular fa-file-lines"></i> README.md
        </button>
      </div>
    </div>
  </header>

  <!-- Main Showcase Area -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

    <!-- Directory Explorer Card -->
    <section class="bg-slate-900/60 rounded-xl border border-slate-800 p-5 backdrop-blur-sm">
      <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-4">
        <div class="flex items-center gap-2 text-sm font-semibold text-slate-300">
          <i class="fa-solid fa-folder-open text-amber-400"></i>
          <span>Repository Directory Structure</span>
        </div>
        <span class="text-xs text-slate-500">Click any file to preview</span>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3" id="fileTreeGrid">
        <!-- Generated by JavaScript -->
      </div>
    </section>

    <!-- Filters & Search Toolbar -->
    <section class="flex flex-col md:flex-row gap-4 items-stretch md:items-center justify-between">
      <!-- Category Pills -->
      <div class="flex flex-wrap items-center gap-2" id="categoryPills">
        <!-- Generated by JavaScript -->
      </div>

      <!-- Search Input -->
      <div class="relative min-w-[260px]">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search templates, tags..." 
          class="w-full bg-slate-900 border border-slate-800 rounded-lg pl-10 pr-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition"
        />
      </div>
    </section>

    <!-- Templates Grid -->
    <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="templatesGrid">
      <!-- Generated by JavaScript -->
    </section>
  </main>

  <!-- Interactive Viewport Preview Modal -->
  <div id="previewModal" class="fixed inset-0 z-50 hidden bg-slate-950/90 backdrop-blur-md flex flex-col">
    <!-- Modal Toolbar -->
    <div class="h-14 border-b border-slate-800 bg-slate-900 px-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span id="modalTitle" class="font-semibold text-slate-200 text-sm">Preview</span>
        <span id="modalFilename" class="text-xs text-slate-400 font-mono bg-slate-800 px-2 py-0.5 rounded">filename.html</span>
      </div>

      <!-- Device Responsive Toggles -->
      <div class="flex items-center bg-slate-950 p-1 rounded-lg border border-slate-800 gap-1">
        <button onclick="setViewport('desktop')" id="btnDesktop" class="px-2.5 py-1 text-xs rounded text-slate-300 hover:bg-slate-800 transition flex items-center gap-1.5 active-device">
          <i class="fa-solid fa-desktop"></i> Desktop
        </button>
        <button onclick="setViewport('tablet')" id="btnTablet" class="px-2.5 py-1 text-xs rounded text-slate-400 hover:bg-slate-800 transition flex items-center gap-1.5">
          <i class="fa-solid fa-tablet-screen-button"></i> Tablet
        </button>
        <button onclick="setViewport('mobile')" id="btnMobile" class="px-2.5 py-1 text-xs rounded text-slate-400 hover:bg-slate-800 transition flex items-center gap-1.5">
          <i class="fa-solid fa-mobile-screen-button"></i> Mobile
        </button>
      </div>

      <!-- Close Action -->
      <button onclick="closePreviewModal()" class="text-slate-400 hover:text-slate-200 p-2 rounded-lg hover:bg-slate-800 transition">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>

    <!-- Frame Wrapper -->
    <div class="flex-1 bg-slate-950 flex items-center justify-center p-4 overflow-hidden">
      <iframe id="previewFrame" class="w-full h-full rounded-lg border border-slate-800 bg-white shadow-2xl transition-all duration-300"></iframe>
    </div>
  </div>

  <!-- Code / README Modal -->
  <div id="textModal" class="fixed inset-0 z-50 hidden bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-3xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-800 flex items-center justify-between">
        <h3 id="textModalTitle" class="font-bold text-slate-200">Code Inspection</h3>
        <button onclick="closeTextModal()" class="text-slate-400 hover:text-slate-200 p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <div class="p-5 overflow-y-auto flex-1 font-mono text-xs text-slate-300 leading-relaxed bg-slate-950">
        <pre id="textModalContent">Loading...</pre>
      </div>
    </div>
  </div>

  <script>
    const templates = [
      { id: 1, file: "portfolio-website-1.html", title: "Minimal Full-Stack Developer", category: "Developer", badge: "Minimal Tech", desc: "Clean developer layout with dark mode toggle, experience timeline, stack badges, and terminal aesthetics.", tags: ["Developer", "Minimal", "Tailwind"] },
      { id: 2, file: "portfolio-website-2.html", title: "Creative UI/UX & Motion Studio", category: "Designer", badge: "Creative / Motion", desc: "Vibrant showcase with interactive work sliders, case study highlights, and fluid motion design elements.", tags: ["Figma", "UI/UX", "Motion"] },
      { id: 3, file: "portfolio-website-3.html", title: "Dark Mode Glassmorphism Tech Lead", category: "Dark Mode", badge: "Dark Glass", desc: "Deep ambient dark theme with glowing frosted glass cards, architecture diagrams, and career timeline.", tags: ["Dark Mode", "Glassmorphism"] },
      { id: 4, file: "portfolio-website-4.html", title: "Editorial Typography Resume", category: "Minimal", badge: "Editorial Serif", desc: "Magazine feel featuring Playfair Display typography, monochrome design, and published works grid.", tags: ["Editorial", "Typography"] },
      { id: 5, file: "portfolio-website-5.html", title: "Modern Product Engineer & SaaS", category: "Developer", badge: "SaaS & Product", desc: "Tailored for full-stack SaaS builders with metric counters, micro-app embeds, and GitHub widget.", tags: ["Product", "SaaS", "FullStack"] },
      { id: 6, file: "portfolio-website-6.html", title: "Cyberpunk Synthwave Developer", category: "Terminal", badge: "Cyberpunk / Neon", desc: "High-contrast cyan & magenta aesthetic, retro grid floor visualizer, and neon stats layout.", tags: ["Cyberpunk", "Neon", "Retro"] },
      { id: 7, file: "portfolio-website-7.html", title: "Soft Pastel Creative Portfolio", category: "Creative", badge: "Soft Pastel", desc: "Aesthetic pastel hues, friendly rounded geometry, soft shadows, and playful design accents.", tags: ["Pastel", "Soft", "Creative"] },
      { id: 8, file: "portfolio-website-8.html", title: "Executive & Consultant Profile", category: "Executive", badge: "Executive", desc: "Corporate slate palette, KPI metrics, client testimonials grid, advisory services, and booking link.", tags: ["Executive", "Consultant"] },
      { id: 9, file: "portfolio-website-9.html", title: "Monochrome Architectural Grid", category: "Minimal", badge: "Monochrome", desc: "High-contrast black & white design with sharp structural borders, Swiss typography, and clean grid.", tags: ["Monochrome", "Swiss", "Grid"] },
      { id: 10, file: "portfolio-website-10.html", title: "Interactive 3D Card & FX Gallery", category: "Creative", badge: "Interactive FX", desc: "Hover depth 3D perspective cards, glowing ambient background lights, and smooth transitions.", tags: ["3D Effects", "Interactive"] },
      { id: 11, file: "portfolio-website-11.html", title: "Terminal / CLI Hacker Theme", category: "Terminal", badge: "CLI Terminal", desc: "Interactive command-line theme with prompt cursor, command autocomplete, ASCII banner, and help menu.", tags: ["CLI", "Terminal", "Hacker"] },
      { id: 12, file: "portfolio-website-12.html", title: "Vibrant Freelance Agency Showcase", category: "Designer", badge: "Agency", desc: "High-energy agency template featuring team grids, service rate cards, client reviews, and metrics.", tags: ["Agency", "Freelance", "Services"] }
    ];

    let activeCategory = "All";
    let searchQuery = "";

    document.addEventListener("DOMContentLoaded", () => {
      renderFileTree();
      renderCategories();
      renderGrid();

      document.getElementById("searchInput").addEventListener("input", (e) => {
        searchQuery = e.target.value.toLowerCase();
        renderGrid();
      });
    });

    function renderFileTree() {
      const container = document.getElementById("fileTreeGrid");
      let html = `
        <div onclick="openReadmeModal()" class="flex items-center gap-3 p-2.5 rounded-lg bg-blue-950/30 border border-blue-500/30 cursor-pointer hover:bg-blue-900/30 transition">
          <i class="fa-regular fa-file-code text-blue-400"></i>
          <span class="text-xs font-mono text-blue-200 font-semibold">README.md</span>
        </div>
      `;
      templates.forEach(t => {
        html += `
          <div onclick="openPreview('${t.file}', '${t.title}')" class="flex items-center gap-3 p-2.5 rounded-lg bg-slate-950/60 border border-slate-800 hover:border-slate-700 cursor-pointer transition">
            <i class="fa-regular fa-file-lines text-slate-400"></i>
            <span class="text-xs font-mono text-slate-300 truncate">${t.file}</span>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function renderCategories() {
      const categories = ["All", "Developer", "Designer", "Dark Mode", "Minimal", "Terminal", "Creative", "Executive"];
      const container = document.getElementById("categoryPills");
      container.innerHTML = categories.map(cat => `
        <button 
          onclick="selectCategory('${cat}')" 
          class="px-3 py-1.5 text-xs font-medium rounded-lg border transition ${
            activeCategory === cat 
              ? 'bg-blue-600 border-blue-500 text-white shadow-lg shadow-blue-500/20' 
              : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200 hover:bg-slate-800'
          }"
        >
          ${cat}
        </button>
      `).join('');
    }

    function selectCategory(cat) {
      activeCategory = cat;
      renderCategories();
      renderGrid();
    }

    function renderGrid() {
      const container = document.getElementById("templatesGrid");
      const filtered = templates.filter(t => {
        const matchesCategory = activeCategory === "All" || t.category === activeCategory;
        const matchesSearch = t.title.toLowerCase().includes(searchQuery) || 
                              t.file.toLowerCase().includes(searchQuery) ||
                              t.tags.some(tag => tag.toLowerCase().includes(searchQuery));
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-16 text-center text-slate-500">
            <i class="fa-solid fa-folder-open text-3xl mb-2"></i>
            <p>No matching templates found</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(t => `
        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden flex flex-col hover:border-slate-700 transition group">
          <div class="p-5 flex-1 space-y-3">
            <div class="flex items-center justify-between">
              <span class="px-2.5 py-1 text-[10px] font-mono rounded-full bg-slate-800 text-slate-300 border border-slate-700">${t.badge}</span>
              <span class="text-xs font-mono text-slate-500">${t.file}</span>
            </div>
            <h3 class="font-bold text-slate-100 group-hover:text-blue-400 transition">${t.title}</h3>
            <p class="text-xs text-slate-400 leading-relaxed">${t.desc}</p>
            <div class="flex flex-wrap gap-1.5 pt-2">
              ${t.tags.map(tag => `<span class="text-[10px] bg-slate-950 px-2 py-0.5 rounded text-slate-400 border border-slate-800">${tag}</span>`).join('')}
            </div>
          </div>
          <div class="p-4 bg-slate-950/50 border-t border-slate-800/80 flex items-center justify-between gap-2">
            <button onclick="openPreview('${t.file}', '${t.title}')" class="flex-1 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-lg transition flex items-center justify-center gap-2">
              <i class="fa-solid fa-eye"></i> Live Preview
            </button>
            <button onclick="viewCode('${t.file}')" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-lg transition" title="View Source Code">
              <i class="fa-solid fa-code"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    /* Modal Operations */
    function openPreview(file, title) {
      const modal = document.getElementById("previewModal");
      const frame = document.getElementById("previewFrame");
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalFilename").textContent = file;
      
      frame.src = `portfolio-websites/${file}`;
      setViewport('desktop');
      modal.classList.remove("hidden");
    }

    function closePreviewModal() {
      const modal = document.getElementById("previewModal");
      const frame = document.getElementById("previewFrame");
      frame.src = "about:blank";
      modal.classList.add("hidden");
    }

    function setViewport(type) {
      const frame = document.getElementById("previewFrame");
      const btns = {
        desktop: document.getElementById("btnDesktop"),
        tablet: document.getElementById("btnTablet"),
        mobile: document.getElementById("btnMobile")
      };

      Object.values(btns).forEach(b => {
        b.classList.remove("bg-slate-800", "text-slate-100");
        b.classList.add("text-slate-400");
      });

      btns[type].classList.add("bg-slate-800", "text-slate-100");

      if (type === 'mobile') frame.style.maxWidth = '375px';
      else if (type === 'tablet') frame.style.maxWidth = '768px';
      else frame.style.maxWidth = '100%';
    }

    function viewCode(file) {
      const modal = document.getElementById("textModal");
      const content = document.getElementById("textModalContent");
      document.getElementById("textModalTitle").textContent = `Source Code: portfolio-websites/${file}`;
      content.textContent = "Loading file content...";
      modal.classList.remove("hidden");

      fetch(`portfolio-websites/${file}`)
        .then(res => res.text())
        .then(text => { content.textContent = text; })
        .catch(() => { content.textContent = `<!-- Could not auto-load source via fetch. Open portfolio-websites/${file} directly in VS Code. -->`; });
    }

    function openReadmeModal() {
      const modal = document.getElementById("textModal");
      const content = document.getElementById("textModalContent");
      document.getElementById("textModalTitle").textContent = "README.md";
      modal.classList.remove("hidden");

      fetch('README.md')
        .then(res => res.text())
        .then(text => { content.textContent = text; })
        .catch(() => { 
          content.textContent = "# portfolio-websites\n\nCollection of 12 responsive portfolio HTML templates."; 
        });
    }

    function closeTextModal() {
      document.getElementById("textModal").classList.add("hidden");
    }
  </script>
</body>
</html>
